name: protocol-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: protocol-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # This repository is public. Never execute fork PR code on the owner's MacBook.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner)
    runs-on: [self-hosted, macOS, ARM64, craft-protocol-macbook]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify package manifest
        run: ./tools/generate-manifest.sh --check
      - name: Reject local/session data
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(sessions?|runtime|logs?|pids?|backups?)/|session\.jsonl$'
          ! rg -n '/Users/[^/$ ]+|proj_[a-z0-9]+|2608[0-9]{2}-[a-z]+-[a-z]+' . \
            -g '!.git/**' -g '!SECURITY.md' -g '!.github/workflows/test.yml'
      - name: Verify source license headers
        shell: bash
        run: |
          set -euo pipefail
          for file in install.sh scripts/*.py scripts/*.sh tools/*.sh v4/src/*.ts v4/tests/*.ts; do
            head -n 3 "$file" | grep -q 'SPDX-License-Identifier: Apache-2.0'
          done
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - name: Verify v4 scheduler core
        working-directory: v4
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
      - name: Install scripts into isolated home path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.craft-agent/scripts"
          find scripts -maxdepth 1 -type f -exec cp {} "$HOME/.craft-agent/scripts/" \;
          chmod 700 "$HOME/.craft-agent/scripts/"*.py "$HOME/.craft-agent/scripts/"*.sh
      - name: Compile installed payload
        run: python3 -m py_compile "$HOME/.craft-agent/scripts/"*.py
      - name: Verify deterministic pre-session boundary
        shell: bash
        run: |
          set -euo pipefail
          ! rg -n 'spawn_session|send_agent_message|archive_session|call_llm' "$HOME/.craft-agent/scripts/worker-watchdog.py" "$HOME/.craft-agent/scripts/recovery-incident.py" "$HOME/.craft-agent/scripts/recovery-admission.py"
          ! rg -n 'session\.jsonl.*write|sqlite|__get-ws-token' "$HOME/.craft-agent/scripts/recovery-admission.py"
      - name: Run regression suite against installed payload
        working-directory: tests
        run: CRAFT_TEST_SCRIPTS="$HOME/.craft-agent/scripts" python3 -m unittest -v test_worker_reliability.py test_orchestration_v320.py test_self_healing_v311.py test_delivery_mode_v320.py test_controller_harness_v321.py test_recovery_admission_v322.py test_external_wait_v321.py test_coordinator_v330.py
      - name: Installer dry run
        run: ./install.sh
