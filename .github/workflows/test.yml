name: protocol-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify package manifest
        run: ./tools/generate-manifest.sh --check
      - name: Reject local/session data
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(sessions?|runtime|logs?|pids?|backups?)/|session\.jsonl$'
          ! rg -n '/Users/[^/$ ]+|proj_[a-z0-9]+|2608[0-9]{2}-[a-z]+-[a-z]+' . \
            -g '!.git/**' -g '!SECURITY.md' -g '!.github/workflows/test.yml'
      - name: Verify source license headers
        shell: bash
        run: |
          set -euo pipefail
          for file in install.sh scripts/*.py scripts/*.sh tools/*.sh; do
            head -n 3 "$file" | grep -q 'SPDX-License-Identifier: Apache-2.0'
          done
      - name: Install scripts into isolated home path
        run: |
          mkdir -p "$HOME/.craft-agent/scripts"
          cp scripts/* "$HOME/.craft-agent/scripts/"
          chmod 700 "$HOME/.craft-agent/scripts/"*.py "$HOME/.craft-agent/scripts/"*.sh
      - name: Compile
        run: python3 -m py_compile scripts/*.py
      - name: Verify deterministic watchdog boundary
        shell: bash
        run: |
          set -euo pipefail
          ! rg -n 'spawn_session|send_agent_message|archive_session|call_llm' scripts/worker-watchdog.py scripts/recovery-incident.py
      - name: Run regression suite
        working-directory: tests
        run: python3 -m unittest -v test_worker_reliability.py test_orchestration_v31.py test_self_healing_v311.py
      - name: Installer dry run
        run: ./install.sh
